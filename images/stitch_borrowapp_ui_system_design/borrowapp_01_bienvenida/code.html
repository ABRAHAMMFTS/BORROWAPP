<!DOCTYPE html><html lang="es" style=""><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>BorrowApp - Bienvenida</title>
<!-- Tailwind CSS CDN with forms and container queries plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Font: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<!-- Tailwind Configuration -->
<script data-purpose="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              teal: '#0D5C56',
              tealLight: '#0F766E',
              amber: '#F59E0B',
              amberDark: '#D97706',
              bgLight: '#F8FAFC',
              slateCard: '#F1F5F9',
              darkText: '#0F172A',
              mutedText: '#64748B'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          boxShadow: {
            'soft-amber': '0 10px 25px -4px rgba(245, 158, 11, 0.28), 0 6px 12px -3px rgba(245, 158, 11, 0.15)',
            'subtle-card': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
            'glow-teal': '0 0 50px -10px rgba(13, 92, 86, 0.15)'
          }
        }
      }
    }
  </script>
<!-- Typography and Base Styles -->
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
  </style>
<!-- Custom Layout and Micro-decorations -->
<style data-purpose="layout">
    .ios-screen-container {
      width: 100%;
      max-width: 390px;
      min-height: 844px;
      height: 100vh;
    }
    .mesh-gradient-bg {
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(15, 118, 110, 0.07) 0%, transparent 45%),
        radial-gradient(circle at 85% 75%, rgba(245, 158, 11, 0.08) 0%, transparent 45%);
    }
  </style>
</head>
<body class="bg-slate-200 flex items-center justify-center min-h-screen p-0 sm:p-4 select-none">
<!-- BEGIN: MobileScreenContainer -->
<!-- iPhone 14/15 Pro Dimensions Viewport Shell -->
<main class="ios-screen-container bg-brand-bgLight text-brand-darkText flex flex-col justify-between relative overflow-hidden sm:rounded-[48px] sm:shadow-2xl sm:border-[8px] sm:border-slate-800/10">
<!-- BEGIN: AmbientBackgroundGlow -->
<div aria-hidden="true" class="absolute inset-0 mesh-gradient-bg pointer-events-none"></div>
<div aria-hidden="true" class="absolute -top-24 -left-20 w-64 h-64 bg-teal-500/10 rounded-full blur-3xl pointer-events-none"></div>
<div aria-hidden="true" class="absolute -bottom-20 -right-20 w-72 h-72 bg-amber-500/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- END: AmbientBackgroundGlow -->
<!-- BEGIN: TopBar -->
<header class="w-full pt-3 px-7 z-20" data-purpose="ios-status-bar">
<!-- iOS Status Bar Elements -->
<div class="flex justify-between items-center text-xs font-semibold tracking-tight text-slate-800">
<!-- Time -->
<span class="tracking-normal font-bold">9:41</span>
<!-- Sensor Island / Notch Simulation for visual fidelity -->
<div class="w-28 h-4 bg-black/5 rounded-full mx-auto hidden sm:block"></div>
<!-- System Icons: Cellular, Wifi, Battery -->
<div class="flex items-center space-x-2">
<!-- Signal Icon -->
<svg aria-label="Señal" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.2.2-.2.51 0 .71.2.2.51.2.71 0l1.83-1.83C8.42 19.34 10.13 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path>
</svg>
<!-- Wifi Icon -->
<svg aria-label="Wifi" class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.78 0 7.2 1.54 9.68 4.02L12 19.33 2.32 11.52C4.8 9.04 8.22 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon with Level -->
<div class="flex items-center">
<div class="w-5 h-2.5 border border-slate-700/80 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
<div class="w-0.5 h-1 bg-slate-700/80 rounded-r-xs"></div>
</div>
</div>
</div>
</header>
<!-- END: TopBar -->
<!-- BEGIN: BrandHeroSection -->
<section class="flex-1 flex flex-col items-center justify-center px-6 text-center z-10 -mt-6" data-purpose="hero-content"><!-- Rounded Logo Card matching IMAGE_3 -->
<div class="relative mb-6" data-purpose="brand-logo-container"><div class="w-44 h-40 sm:w-48 sm:h-44 rounded-[36px] bg-[#f5ede0] overflow-hidden flex items-center justify-center shadow-sm p-4"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuASbi3HFT8xvPwm9XuqcNRPTB_HONeXSgCddNS4SIDgnysAHvr22Eitb4p9d9bY-XtOZUfP2KkgUV_Halv9nCYPGbXr58VXm-Rb6xeuVwG83RCfk5XF5ts6DHuLicamHLJDplSst8CBkI6OUUZVIb_jMphYZhIp_V9ckGj0PlKkM1JlavT6-7RVzi68MHB47qOrZNPQg3yWsh1xThjmSglc9gaSDNC4tngQH5Rub_OVblsCVaKZZORYKtROBpJyK2fbkA" alt="Borrow App Logo" class="w-full h-full object-contain"></div></div>

<!-- App Title & Tag -->
<div class="flex flex-col items-center">
  <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 mb-2">
    Borrow <span class="text-[#0d5c56]">App</span>
  </h1>
  <!-- Pill badge -->
  <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-teal-50 border border-teal-200/80 text-xs font-semibold text-[#0d5c56] mb-3">
    <span class="w-2 h-2 rounded-full bg-[#0d9488]"></span>
    Comunidad colaborativa
  </div>
</div>

<!-- Tagline -->
<p class="text-slate-600 text-sm max-w-[250px] mx-auto text-center leading-relaxed font-medium">
  Comparte lo que tienes, encuentra lo que necesitas
</p>

<!-- Feature Highlights Row -->
<div class="flex items-center justify-center gap-7 mt-8 pt-6 border-t border-slate-200/60 w-full max-w-[280px]">
  <div class="flex flex-col items-center gap-1.5">
    <div class="w-9 h-9 rounded-xl bg-slate-100/90 flex items-center justify-center text-[#0d5c56]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </div>
    <span class="text-[11px] text-slate-600 font-medium">Seguro</span>
  </div>
  <div class="w-[1px] h-7 bg-slate-200"></div>
  <div class="flex flex-col items-center gap-1.5">
    <div class="w-9 h-9 rounded-xl bg-slate-100/90 flex items-center justify-center text-[#0d5c56]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </div>
    <span class="text-[11px] text-slate-600 font-medium">En campus</span>
  </div>
  <div class="w-[1px] h-7 bg-slate-200"></div>
  <div class="flex flex-col items-center gap-1.5">
    <div class="w-9 h-9 rounded-xl bg-slate-100/90 flex items-center justify-center text-[#d97706]">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path d="M13 10V3L4 14h7v7l9-11h-7z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
      </svg>
    </div>
    <span class="text-[11px] text-slate-600 font-medium">Rápido</span>
  </div>
</div></section>
<!-- END: BrandHeroSection -->
<!-- BEGIN: CallToActionArea -->
<footer class="w-full px-6 pb-9 pt-4 flex flex-col gap-3 z-20" data-purpose="actions-footer"><!-- Primary Action: Crear cuenta -->
<button class="w-full py-4 px-6 bg-[#d97706] hover:bg-[#b45309] text-white font-semibold text-base rounded-2xl shadow-lg shadow-amber-500/25 active:scale-[0.985] transition-all duration-150 flex items-center justify-center gap-2 cursor-pointer focus:outline-none" data-purpose="btn-crear-cuenta" type="button">
  <span class="">Crear cuenta</span>
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path d="M14 5l7 7m0 0l-7 7m7-7H3" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
  </svg>
</button>
<!-- Secondary Action: Iniciar sesión -->
<button class="w-full py-4 px-6 bg-white text-[#0d5c56] font-semibold text-base rounded-2xl border border-teal-800/20 active:scale-[0.985] transition-all duration-150 flex items-center justify-center cursor-pointer shadow-sm hover:bg-slate-50 focus:outline-none" data-purpose="btn-iniciar-sesion" type="button">
  <span class="">Iniciar sesión</span>
</button>
<!-- Footer note -->
<p class="text-center text-xs text-slate-400 mt-2 font-medium">
  Hecho para comunidades universitarias y locales
</p>
<!-- Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-2 opacity-70"></div></footer>
<!-- END: CallToActionArea -->
</main>
<!-- END: MobileScreenContainer -->












</body></html>
