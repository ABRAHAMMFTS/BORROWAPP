<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Publicar Necesidad - BorrowApp</title>
<!-- Tailwind CSS CDN with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<style data-purpose="typography">
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
      background-color: #F8FAFC;
    }
  </style>
<style data-purpose="layout">
    /* iOS Safe Area handling */
    .pt-safe {
      padding-top: env(safe-area-inset-top, 20px);
    }
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 24px);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 flex justify-center min-h-screen">
<!-- BEGIN: MobileContainer -->
<!-- Constrained container replicating iOS viewport (~390px) -->
<div class="w-full max-w-[420px] bg-[#F8FAFC] min-h-screen flex flex-col justify-between shadow-2xl relative">
<!-- BEGIN: TopSectionWrapper -->
<div>
<!-- BEGIN: StatusBar -->
<!-- iOS Mobile Status Bar simulation -->
<div class="w-full px-7 pt-3.5 pb-1 flex justify-between items-center text-xs font-semibold text-slate-900 tracking-tight select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Cellular signal -->
<svg class="w-4 h-3.5 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="7" rx="0.5" width="2.5" x="4" y="5"></rect>
<rect height="10" rx="0.5" width="2.5" x="8" y="2"></rect>
<rect height="12" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 16 12">
<path d="M8 2.8C5.2 2.8 2.7 3.9 0.8 5.7L0 4.8C2.2 2.7 5 1.4 8 1.4C11 1.4 13.8 2.7 16 4.8L15.2 5.7C13.3 3.9 10.8 2.8 8 2.8ZM8 6.4C6.3 6.4 4.7 7.1 3.5 8.3L2.7 7.4C4.1 6.1 6 5.2 8 5.2C10 5.2 11.9 6.1 13.3 7.4L12.5 8.3C11.3 7.1 9.7 6.4 8 6.4ZM8 9.9C7.2 9.9 6.5 10.2 6 10.8L8 13L10 10.8C9.5 10.2 8.8 9.9 8 9.9Z"></path>
</svg>
<!-- Battery icon -->
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- END: StatusBar -->
<!-- BEGIN: NavigationHeader -->
<!-- Navigation bar with back button and screen title -->
<header class="px-5 py-3 flex items-center gap-3">
<button aria-label="Volver atrás" class="p-1 -ml-1 text-slate-800 active:opacity-60 transition-opacity" type="button">
<svg class="w-6 h-6 stroke-[2.25]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold tracking-tight text-slate-900">
          Publicar Necesidad
        </h1>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: NeedForm -->
<!-- Main form for borrowing request -->
<main class="px-5 pt-3 pb-6">
<form class="space-y-4" id="form-publicar-necesidad">
<!-- Field: Object name -->
<div data-purpose="field-container">
<label class="block text-sm font-semibold text-slate-700 mb-1.5" for="objeto">
              Objeto
            </label>
<input class="w-full h-12 px-4 rounded-xl bg-white border border-[#E2E8F0] text-slate-800 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1B2A4A] focus:border-[#1B2A4A] transition-all placeholder:text-slate-400" id="objeto" name="objeto" placeholder="Ej: Calculadora científica, Taladro" type="text" value="Calculadora científica"/>
</div>
<!-- Field: Description -->
<div data-purpose="field-container">
<label class="block text-sm font-semibold text-slate-700 mb-1.5" for="descripcion">
              Descripción
            </label>
<textarea class="w-full p-4 rounded-xl bg-white border border-[#E2E8F0] text-slate-800 text-sm leading-relaxed shadow-sm resize-none focus:outline-none focus:ring-2 focus:ring-[#1B2A4A] focus:border-[#1B2A4A] transition-all placeholder:text-slate-400" id="descripcion" name="descripcion" placeholder="Para el examen de física del jueves... detalles de uso y cuidado." rows="4">Para el examen de física del jueves en la tarde. Me comprometo a cuidarla bien y devolverla a tiempo.</textarea>
</div>
<!-- Fields: Date Range (Fechas de inicio y fin) -->
<div class="grid grid-cols-2 gap-3" data-purpose="field-dates">
<!-- Date: Start -->
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1.5" for="fecha-inicio">
                Fecha inicio
              </label>
<div class="relative">
<input class="w-full h-12 pl-3.5 pr-9 rounded-xl bg-white border border-[#E2E8F0] text-slate-800 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1B2A4A] focus:border-[#1B2A4A] transition-all" id="fecha-inicio" name="fecha_inicio" type="text" value="08/09/2026"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-linecap="round" stroke-linejoin="round" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Date: End -->
<div>
<label class="block text-sm font-semibold text-slate-700 mb-1.5" for="fecha-fin">
                Fecha fin
              </label>
<div class="relative">
<input class="w-full h-12 pl-3.5 pr-9 rounded-xl bg-white border border-[#E2E8F0] text-slate-800 text-sm font-medium shadow-sm focus:outline-none focus:ring-2 focus:ring-[#1B2A4A] focus:border-[#1B2A4A] transition-all" id="fecha-fin" name="fecha_fin" type="text" value="22/09/2026"/>
<div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-slate-400">
<svg class="w-4 h-4 stroke-[1.8]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<rect height="18" rx="2" stroke-linecap="round" stroke-linejoin="round" width="18" x="3" y="4"></rect>
<path d="M16 2v4M8 2v4M3 10h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
</div>
<!-- BEGIN: InformativeNotice -->
<!-- Soft community informative badge/notice -->
<div class="pt-1.5" data-purpose="info-banner">
<div class="bg-blue-50/70 border border-blue-100 rounded-xl p-3.5 flex items-start space-x-2.5">
<svg class="w-4 h-4 text-blue-600 mt-0.5 flex-shrink-0" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" fill-rule="evenodd"></path>
</svg>
<p class="text-xs text-slate-600 leading-relaxed font-normal">
                Los miembros de <span class="font-semibold text-slate-800">Universidad Tecnológica de Bolívar</span> que tengan este objeto podrán ofrecértelo.
              </p>
</div>
</div>
<!-- END: InformativeNotice -->
</form>
</main>
<!-- END: NeedForm -->
</div>
<!-- END: TopSectionWrapper -->
<!-- BEGIN: BottomActionSection -->
<!-- Fixed style bottom container with call-to-action button and iOS home indicator -->
<footer class="px-5 pt-3 pb-safe bg-[#F8FAFC]">
<!-- Submit Button -->
<button class="w-full h-[52px] bg-[#1E2B3E] hover:bg-[#152030] active:scale-[0.99] text-white font-semibold text-base rounded-xl flex items-center justify-center shadow-md transition duration-150 ease-in-out cursor-pointer" form="form-publicar-necesidad" type="submit">
        Publicar necesidad
      </button>
<!-- iOS Home indicator bar -->
<div class="w-32 h-1 bg-slate-300 rounded-full mx-auto mt-4 mb-1"></div>
</footer>
<!-- END: BottomActionSection -->
</div>
<!-- END: MobileContainer -->
</body></html>
