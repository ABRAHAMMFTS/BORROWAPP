<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BorrowApp - Registro</title>
<!-- Tailwind CSS CDN with Forms Plugin -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            borrow: {
              amber: '#F59E0B',
              'amber-hover': '#D97706',
              primary: '#0F172A',
              subtle: '#64748B',
              border: '#E2E8F0',
              bg: '#F8FAFC',
            }
          },
          boxShadow: {
            'soft': '0 4px 20px -2px rgba(15, 23, 42, 0.05)',
            'btn': '0 8px 20px -4px rgba(245, 158, 11, 0.35)',
          }
        }
      }
    }
  </script>
<style data-purpose="base-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #ECEFF1;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-slate-800">
<!-- BEGIN: MobileContainer -->
<!-- Simulated iPhone 390px canvas -->
<main class="w-full max-w-[390px] h-[844px] bg-white sm:rounded-[44px] sm:shadow-2xl overflow-hidden flex flex-col justify-between border border-slate-100 relative">
<!-- BEGIN: TopBarSection -->
<header class="pt-3 px-6 pb-2" data-purpose="mobile-header">
<!-- iOS Status Bar Simulation -->
<div class="flex justify-between items-center text-xs font-semibold tracking-tight text-slate-900 mb-4 px-1" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.89 16.5 2 14.36 2 12 2 6.48 6.48 2 12 2c5.52 0 10 4.48 10 10 0 2.36-.89 4.5-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zM6.5 12c0-3.04 2.46-5.5 5.5-5.5s5.5 2.46 5.5 5.5c0 1.34-.48 2.57-1.28 3.53l-.73-.73c.63-.78 1.01-1.76 1.01-2.8 0-2.48-2.02-4.5-4.5-4.5S7.5 9.52 7.5 12c0 1.04.38 2.02 1.01 2.8l-.73.73C7.98 14.57 7.5 13.34 7.5 12z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98A16.88 16.88 0 0012 4zm0 3c3.78 0 7.24 1.48 9.8 3.91L12 18.6 2.2 10.91A13.9 13.9 0 0112 7z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-900 rounded-[1px]"></div>
</div>
</div>
</div>
<!-- Back Navigation Button -->
<nav aria-label="Navegación principal" class="flex items-center -ml-2">
<button aria-label="Volver atrás" class="p-2 text-slate-800 hover:text-slate-600 transition-colors rounded-full hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-amber-500/20" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</nav>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: FormContentSection -->
<div class="px-7 flex-1 flex flex-col justify-start pt-2 overflow-y-auto" data-purpose="registration-form-container">
<!-- Screen Heading -->
<header class="mb-7">
<h1 class="text-2xl font-bold tracking-tight text-slate-900 leading-snug">Registro</h1>
<p class="text-sm font-medium text-slate-500 mt-1">Crea una cuenta para compartir y pedir prestado</p>
</header>
<!-- Registration Form -->
<form class="space-y-4" data-purpose="signup-fields" id="register-form" onsubmit="event.preventDefault();">
<!-- Input: Nombre Completo -->
<div class="space-y-1.5" data-purpose="field-group">
<label class="block text-xs font-semibold text-slate-700 tracking-wide uppercase" for="fullname">Nombre completo</label>
<div class="relative">
<input class="w-full px-4 py-3 text-sm font-medium text-slate-900 bg-white border border-[#E2E8F0] rounded-[12px] focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 transition-all duration-200 placeholder:text-slate-400" id="fullname" name="fullname" placeholder="Ej. Juan Pérez" type="text" value="Jesús Vergara"/>
</div>
</div>
<!-- Input: Correo Electrónico -->
<div class="space-y-1.5" data-purpose="field-group">
<label class="block text-xs font-semibold text-slate-700 tracking-wide uppercase" for="email">Correo electrónico</label>
<div class="relative">
<input class="w-full px-4 py-3 text-sm font-medium text-slate-900 bg-white border border-[#E2E8F0] rounded-[12px] focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 transition-all duration-200 placeholder:text-slate-400" id="email" name="email" placeholder="nombre@correo.com" type="email" value="jesus.vergara@correo.com"/>
</div>
</div>
<!-- Input: Contraseña -->
<div class="space-y-1.5" data-purpose="field-group">
<label class="block text-xs font-semibold text-slate-700 tracking-wide uppercase" for="password">Contraseña</label>
<div class="relative">
<input class="w-full pl-4 pr-11 py-3 text-sm font-medium text-slate-900 bg-white border border-[#E2E8F0] rounded-[12px] focus:outline-none focus:border-amber-500 focus:ring-4 focus:ring-amber-500/10 transition-all duration-200 placeholder:text-slate-400" id="password" name="password" placeholder="••••••••" type="password" value="secretPass123"/>
<!-- Password Visibility Toggle Button -->
<button aria-label="Mostrar u ocultar contraseña" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors" id="toggle-password" type="button">
<!-- Eye Off / On SVG Icon -->
<svg class="w-5 h-5 stroke-[1.8]" fill="none" id="eye-icon" stroke="currentColor" viewbox="0 0 24 24">
<path d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Password Requirement & Strength Indicator -->
<div class="pt-1.5 flex items-center justify-between" data-purpose="password-security-hint">
<span class="text-xs text-slate-500 font-medium tracking-tight">Mínimo 8 caracteres</span>
<!-- Security status chips -->
<div aria-label="Indicador de seguridad" class="flex items-center space-x-1">
<span class="w-4 h-1 rounded-full bg-emerald-500"></span>
<span class="w-4 h-1 rounded-full bg-emerald-500"></span>
<span class="w-4 h-1 rounded-full bg-emerald-500"></span>
<span class="text-[10px] text-emerald-600 font-semibold ml-1.5">Segura</span>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-6">
<button class="w-full py-3.5 px-4 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold text-sm tracking-wide rounded-[14px] shadow-btn active:scale-[0.99] transition-all duration-150 flex items-center justify-center space-x-2" type="submit">
<span>Crear cuenta</span>
</button>
</div>
</form>
</div>
<!-- END: FormContentSection -->
<!-- BEGIN: FooterSection -->
<footer class="p-6 text-center" data-purpose="screen-footer">
<p class="text-xs font-medium text-slate-600">
        ¿Ya tienes cuenta? 
        <a class="text-slate-900 font-bold hover:underline ml-1 underline-offset-2" href="#login">
          Inicia sesión
        </a>
</p>
<!-- iOS Home Indicator -->
<div aria-hidden="true" class="w-32 h-1 bg-slate-200 rounded-full mx-auto mt-6"></div>
</footer>
<!-- END: FooterSection -->
</main>
<!-- END: MobileContainer -->
<script data-purpose="password-toggle">
    // Toggle password visibility handler
    const toggleBtn = document.getElementById('toggle-password');
    const passwordInput = document.getElementById('password');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    });
  </script>
</body></html>
