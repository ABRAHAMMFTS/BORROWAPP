<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BorrowApp - Sin Organización</title>
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            borrow: {
              orange: '#FF5C00',
              'orange-soft': '#FFF4EE',
              navy: '#0F1E36',
              teal: '#008575',
              'teal-soft': '#E6F4F2',
              surface: '#F8F9FC',
              border: '#E8ECF2',
              muted: '#6E7C91',
            }
          },
          boxShadow: {
            'card': '0 8px 30px -4px rgba(15, 30, 54, 0.06), 0 2px 8px -2px rgba(15, 30, 54, 0.04)',
            'card-hover': '0 16px 36px -6px rgba(15, 30, 54, 0.1), 0 4px 12px -2px rgba(15, 30, 54, 0.05)'
          }
        }
      }
    }
  </script>
<!-- Custom Core Styles -->
<style data-purpose="base-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      background-color: #F1F4F9;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-4 text-borrow-navy antialiased selection:bg-borrow-orange selection:text-white">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Constrained precisely to mobile standard (390px x 844px safe viewport) -->
<main class="w-full max-w-[390px] min-h-[844px] bg-white flex flex-col justify-between shadow-2xl relative overflow-hidden sm:rounded-[48px] border sm:border-slate-200">
<!-- BEGIN: TopBarSection -->
<header class="w-full pt-3 px-7 flex flex-col z-10" data-purpose="header">
<!-- iOS Status Bar -->
<div class="w-full flex justify-between items-center text-[15px] font-semibold tracking-tight text-borrow-navy mb-4">
<span>9:41</span>
<div class="flex items-center space-x-2 text-borrow-navy">
<!-- Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.58 10.59 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.51 0 6.72 1.34 9.14 3.53L12 19.33 2.86 11.03C5.28 8.84 8.49 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-borrow-navy rounded-sm p-0.5 flex items-center">
<div class="w-full h-full bg-borrow-navy rounded-2xs"></div>
</div>
</div>
</div>
<!-- Subtle View Title -->
<div class="w-full text-center pb-1">
<h1 class="text-sm font-semibold tracking-wide text-borrow-muted">Sin Organización</h1>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: MainContentSection -->
<section class="flex-1 flex flex-col items-center justify-center px-6 -mt-3" data-purpose="welcome-illustration-content">
<!-- Community Welcome Visual Illustration -->
<div class="relative w-44 h-44 mb-6 flex items-center justify-center" data-purpose="illustration-wrapper">
<!-- Soft decorative background gradients -->
<div class="absolute inset-0 bg-gradient-to-tr from-amber-100/60 via-orange-50/50 to-teal-50/60 rounded-full filter blur-xl"></div>
<div class="relative w-36 h-36 rounded-full bg-gradient-to-b from-borrow-surface to-white border border-borrow-border/70 flex items-center justify-center shadow-inner">
<!-- Graphic Elements: Community Sharing Scene -->
<svg class="w-24 h-24" fill="none" viewbox="0 0 160 160" xmlns="http://www.w3.org/2000/svg">
<!-- Background Circular Accent -->
<circle cx="80" cy="80" fill="#EBF4F4" fill-opacity="0.8" r="60"></circle>
<!-- Isometric Box / Tool Sharing Container -->
<path d="M46 102L80 120L114 102V76L80 58L46 76V102Z" fill="#F8A038"></path>
<path d="M80 58L114 76L80 94L46 76L80 58Z" fill="#FFBA66"></path>
<path d="M80 94V120L114 102V76L80 94Z" fill="#E68A20"></path>
<!-- Floating Trust & Community Badges -->
<!-- Hand / Key Object Emitting -->
<circle cx="50" cy="54" fill="#008575" fill-opacity="0.15" r="14"></circle>
<path d="M47 50C47 47.79 48.79 46 51 46C53.21 46 55 47.79 55 50C55 51.5 54.17 52.81 52.95 53.5L53.5 58H50.5L50 55H49.05C47.83 54.31 47 52.5 47 50Z" fill="#008575"></path>
<!-- Sharing Sparkles -->
<circle cx="114" cy="52" fill="#FF5C00" fill-opacity="0.12" r="12"></circle>
<path d="M114 46L115.5 50.5L120 52L115.5 53.5L114 58L112.5 53.5L108 52L112.5 50.5L114 46Z" fill="#FF5C00"></path>
<!-- Connected Nodes Symbol -->
<circle cx="80" cy="40" fill="#0F1E36" r="6"></circle>
<line stroke="#0F1E36" stroke-dasharray="2 2" stroke-width="2.5" x1="80" x2="80" y1="46" y2="58"></line>
</svg>
</div>
</div>
<!-- Main Heading and Descriptive Text -->
<div class="text-center max-w-[290px] mb-8">
<h2 class="text-[22px] leading-tight font-bold tracking-tight text-borrow-navy mb-2">
          Aún no perteneces a ninguna organización
        </h2>
<p class="text-[14px] leading-relaxed text-borrow-muted">
          BorrowApp funciona a través de comunidades cerradas como tu universidad, empresa o condominio.
        </p>
</div>
<!-- Action Cards Container -->
<div class="w-full space-y-3.5" data-purpose="options-container">
<!-- Card 1: Unirme con un código -->
<button class="w-full group text-left bg-white rounded-2xl p-4 border border-borrow-border hover:border-borrow-orange transition-all duration-200 shadow-card hover:shadow-card-hover flex items-center justify-between active:scale-[0.99]" type="button">
<div class="flex items-center space-x-3.5 pr-2">
<!-- Icon Avatar -->
<div class="w-12 h-12 rounded-xl bg-borrow-orange-soft text-borrow-orange flex items-center justify-center flex-shrink-0 group-hover:bg-borrow-orange group-hover:text-white transition-colors duration-200">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<path d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Texts -->
<div>
<div class="flex items-center gap-1.5">
<span class="font-bold text-[16px] text-borrow-navy group-hover:text-borrow-orange transition-colors">Unirme con un código</span>
</div>
<p class="text-[12px] text-borrow-muted font-normal mt-0.5 leading-snug">
                Código de 5 caracteres provisto por tu comunidad
              </p>
</div>
</div>
<!-- Arrow Indicator -->
<div class="text-borrow-muted/50 group-hover:text-borrow-orange group-hover:translate-x-0.5 transition-all">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
<!-- Card 2: Crear mi organización -->
<button class="w-full group text-left bg-white rounded-2xl p-4 border border-borrow-border hover:border-borrow-navy transition-all duration-200 shadow-card hover:shadow-card-hover flex items-center justify-between active:scale-[0.99]" type="button">
<div class="flex items-center space-x-3.5 pr-2">
<!-- Icon Avatar -->
<div class="w-12 h-12 rounded-xl bg-borrow-teal-soft text-borrow-teal flex items-center justify-center flex-shrink-0 group-hover:bg-borrow-teal group-hover:text-white transition-colors duration-200">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2" viewbox="0 0 24 24">
<path d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<!-- Texts -->
<div>
<div class="flex items-center gap-2">
<span class="font-bold text-[16px] text-borrow-navy">Crear mi organización</span>
<span class="text-[10px] uppercase font-bold tracking-wider px-1.5 py-0.5 rounded-full bg-slate-100 text-borrow-muted">Admin</span>
</div>
<p class="text-[12px] text-borrow-muted font-normal mt-0.5 leading-snug">
                Serás administrador y recibirás código para invitar
              </p>
</div>
</div>
<!-- Arrow Indicator -->
<div class="text-borrow-muted/50 group-hover:text-borrow-navy group-hover:translate-x-0.5 transition-all">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</button>
</div>
</section>
<!-- END: MainContentSection -->
<!-- BEGIN: FooterSection -->
<footer class="w-full pb-8 pt-3 px-6 flex flex-col items-center justify-center gap-3">
<!-- Helper microcopy -->
<p class="text-[12px] text-borrow-muted/80 text-center flex items-center gap-1.5 font-medium">
<svg class="w-3.5 h-3.5 text-borrow-teal inline" fill="currentColor" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M2.166 4.999A11.954 11.954 0 0010 1.944 11.954 11.954 0 0017.834 5c.11.65.166 1.32.166 2.001 0 5.225-3.34 9.67-8 11.317C5.34 16.67 2 12.225 2 7c0-.682.057-1.35.166-2.001zm11.541 3.708a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" fill-rule="evenodd"></path>
</svg>
        Entorno seguro y de confianza mutua
      </p>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-slate-900/20 rounded-full mt-1"></div>
</footer>
<!-- END: FooterSection -->
</main>
<!-- END: MobileDeviceContainer -->
</body></html>
