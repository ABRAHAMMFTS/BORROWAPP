<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BorrowApp - Unirme (Paso 2)</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            borrow: {
              navy: '#1A2844',
              teal: '#0E766E',
              blueSoft: '#EFF6FF',
              brandBlue: '#1E3A5F',
              accent: '#F97316',
              bgLight: '#F8FAFC',
              cardBorder: '#E2E8F0'
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-styling">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->
<!-- Main mobile viewport canvas constrained to 390px (iPhone 14/15 standard width) -->
<main class="w-full max-w-[390px] h-[844px] bg-white text-slate-800 shadow-2xl flex flex-col justify-between overflow-hidden relative sm:rounded-[44px] border border-slate-200">
<!-- Top Content Area -->
<div class="flex flex-col w-full">
<!-- BEGIN: iOSStatusBar -->
<header class="w-full px-7 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-slate-800 select-none" data-purpose="status-bar">
<span>9:41</span>
<div class="flex items-center space-x-2">
<!-- Cellular signal -->
<svg class="w-4 h-3 fill-current" viewbox="0 0 17 12">
<rect height="4" rx="0.5" width="2.5" x="0" y="8"></rect>
<rect height="6.5" rx="0.5" width="2.5" x="4" y="5.5"></rect>
<rect height="9" rx="0.5" width="2.5" x="8" y="3"></rect>
<rect height="12" rx="0.5" width="2.5" x="12" y="0"></rect>
</svg>
<!-- Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4c4.3 0 8.2 1.6 11.2 4.3l-2.1 2.3c-2.4-2.1-5.6-3.4-9.1-3.4s-6.7 1.3-9.1 3.4L.8 8.3C3.8 5.6 7.7 4 12 4zm0 6c2.8 0 5.4 1.1 7.3 2.9l-2.1 2.3C15.8 14 14 13.3 12 13.3s-3.8.7-5.2 1.9l-2.1-2.3C6.6 11.1 9.2 10 12 10zm0 6c1.4 0 2.6.6 3.5 1.5l-3.5 3.8-3.5-3.8c.9-.9 2.1-1.5 3.5-1.5z"></path>
</svg>
<!-- Battery -->
<div class="w-6 h-3 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full bg-slate-800 rounded-2xs w-full"></div>
</div>
</div>
</header>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationHeader -->
<nav aria-label="Navegación superior" class="w-full px-6 pt-3 pb-4 flex items-center relative">
<!-- Back Button -->
<button aria-label="Volver" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-700 hover:bg-slate-100 transition-colors focus:outline-none" type="button">
<svg class="w-6 h-6 stroke-slate-800" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 24 24">
<line x1="19" x2="5" y1="12" y2="12"></line>
<polyline points="12 19 5 12 12 5"></polyline>
</svg>
</button>
<!-- Title -->
<h1 class="text-xl font-bold text-slate-900 ml-2 tracking-tight">Unirme (Paso 2)</h1>
</nav>
<!-- END: NavigationHeader -->
<!-- BEGIN: MainContent -->
<section class="px-6 pt-2 flex flex-col space-y-6" data-purpose="registration-step-2">
<!-- Organization Preview Card -->
<article class="bg-white rounded-2xl p-5 border border-slate-200/90 shadow-sm flex flex-col items-center text-center transition-all hover:border-slate-300" data-purpose="organization-preview">
<!-- Institutional Campus Icon -->
<div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-slate-100 to-slate-50 flex items-center justify-center border border-slate-200 mb-3 shadow-inner text-slate-700">
<svg class="w-8 h-8 text-borrow-brandBlue" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewbox="0 0 24 24">
<path d="M3 21h18"></path>
<path d="M5 21V7l7-4 7 4v14"></path>
<path d="M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"></path>
<line x1="9" x2="9" y1="9" y2="13"></line>
<line x1="15" x2="15" y1="9" y2="13"></line>
</svg>
</div>
<!-- Organization Name -->
<h2 class="text-base font-bold text-slate-900 leading-snug px-2">
            Universidad Tecnológica de Bolívar, Universidad
          </h2>
<!-- Physical Hub Location -->
<p class="text-xs text-slate-500 mt-2 font-medium flex items-center justify-center">
<svg class="w-3.5 h-3.5 text-slate-400 mr-1 shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
            Punto central: Biblioteca Central, mostrador de atención
          </p>
</article>
<!-- Custom Identifier Field Input Section -->
<div class="flex flex-col space-y-2" data-purpose="custom-id-field">
<label class="text-sm font-semibold text-slate-700" for="student-code">
            Tu código estudiantil
          </label>
<div class="relative">
<input class="w-full px-4 py-3.5 rounded-xl border border-slate-300 text-slate-900 placeholder:text-slate-400 font-medium text-sm focus:outline-none focus:ring-2 focus:ring-borrow-brandBlue focus:border-transparent transition-all shadow-sm bg-white" id="student-code" name="student_code" placeholder="(T00061234)" type="text" value="(T00061234)"/>
</div>
</div>
<!-- Information Notice Banner (Badge) -->
<aside class="bg-blue-50 border border-blue-100 rounded-2xl p-4 flex items-start space-x-3 text-slate-700" data-purpose="community-rule-notice">
<!-- Information Circle Icon -->
<div class="shrink-0 mt-0.5">
<span class="w-5 h-5 rounded-full bg-borrow-brandBlue text-white flex items-center justify-center text-xs font-bold font-serif">
              i
            </span>
</div>
<!-- Explanatory message -->
<p class="text-xs leading-relaxed text-slate-600 font-normal">
            En esta comunidad, todas las entregas y devoluciones se hacen en persona en el <strong class="font-semibold text-slate-800">Punto Central</strong> sin dinero digital
          </p>
</aside>
</section>
<!-- END: MainContent -->
</div>
<!-- BEGIN: BottomActionArea -->
<div class="w-full px-6 pb-9 pt-4 bg-white flex flex-col items-center" data-purpose="bottom-cta">
<!-- Primary Submit Button -->
<button class="w-full py-4 bg-borrow-brandBlue hover:bg-[#152843] text-white font-bold rounded-2xl shadow-lg shadow-borrow-brandBlue/20 active:scale-[0.98] transition-all text-sm tracking-wide flex items-center justify-center" type="submit">
        ¡Unirme a la comunidad!
      </button>
<!-- iOS Home Indicator Bar -->
<div aria-hidden="true" class="w-32 h-1 bg-slate-900/40 rounded-full mt-4"></div>
</div>
<!-- END: BottomActionArea -->
</main>
<!-- END: MobileContainer -->
</body></html>
