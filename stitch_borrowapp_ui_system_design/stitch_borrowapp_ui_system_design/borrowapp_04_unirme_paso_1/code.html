<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>BorrowApp - Unirme (Paso 1)</title>
<!-- Tailwind CSS v3 -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace']
          },
          colors: {
            borrow: {
              primary: '#F97316',
              navy: '#0F1E36',
              bgLight: '#F8FAFC',
              alertRed: '#DC2626',
              keyBg: '#FFFFFF',
              keyboardBg: '#D1D5DB'
            }
          },
          boxShadow: {
            key: '0px 1px 0px rgba(0, 0, 0, 0.35)',
            box: '0px 2px 4px rgba(0, 0, 0, 0.05)'
          }
        }
      }
    }
  </script>
<style data-purpose="base-layout">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #E2E8F0;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
<style data-purpose="ios-keyboard-styles">
    .ios-key {
      background-color: #FFFFFF;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.32);
      border-radius: 5px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      transition: background-color 0.1s ease;
    }
    .ios-key:active {
      background-color: #CBD5E1;
    }
    .ios-key-special {
      background-color: #ABB3BD;
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.32);
      border-radius: 5px;
      user-select: none;
    }
    .ios-key-special:active {
      background-color: #8D96A2;
    }
  </style>
</head>
<body class="p-0 sm:p-4">
<!-- BEGIN: MobileFrameContainer -->
<main class="w-[390px] h-[844px] bg-white rounded-[44px] shadow-2xl overflow-hidden flex flex-col justify-between relative border-[6px] border-slate-900 select-none">
<!-- Top Half Content Container -->
<div class="flex-1 flex flex-col pt-3 px-6">
<!-- BEGIN: iOSStatusBar -->
<div class="w-full flex justify-between items-center px-4 py-1 text-slate-900 font-semibold text-xs tracking-tight" data-purpose="status-bar">
<!-- Time -->
<span>9:41</span>
<!-- Dynamic Island / Sensor Notch Placeholder -->
<div class="w-28 h-4 bg-slate-900 rounded-full mx-auto -mt-1 hidden sm:block"></div>
<!-- System Icons -->
<div class="flex items-center space-x-1.5">
<!-- Signal Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9z" opacity="0.2"></path>
<path d="M2 18h3v4H2v-4zm5-4h3v8H7v-8zm5-4h3v12h-3V10zm5-4h3v16h-3V6z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.78 1.41 9.17 3.71L12 19.34 2.83 11.21C5.22 8.91 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-5 h-2.5 border border-slate-900 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-900 rounded-2xs"></div>
</div>
</div>
</div>
<!-- END: iOSStatusBar -->
<!-- BEGIN: NavigationHeader -->
<header class="flex items-center relative py-4 mt-1" data-purpose="screen-header">
<button aria-label="Volver" class="p-1 -ml-1 text-slate-800 hover:text-slate-600 focus:outline-none" type="button">
<!-- Back Arrow Icon -->
<svg class="w-6 h-6 stroke-[2.5]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="flex-1 text-center font-bold text-[18px] text-slate-900 tracking-tight pr-5">
          Unirme (Paso 1)
        </h1>
</header>
<!-- END: NavigationHeader -->
<!-- BEGIN: CodeInputSection -->
<section class="mt-6 flex flex-col items-center" data-purpose="verification-code-entry">
<!-- Subtitle Prompt -->
<h2 class="text-slate-900 font-bold text-lg mb-6">
          Ingresa el código
        </h2>
<!-- Code Boxes: 5 individual characters [ K ] [ 7 ] [ Q ] [ 4 ] [ X ] -->
<div class="flex justify-center items-center gap-2.5 w-full max-w-[340px]" data-purpose="code-display-boxes">
<!-- Character Box 1: K -->
<div class="w-14 h-16 rounded-xl border-2 border-slate-800 flex items-center justify-center bg-white shadow-box">
<span class="text-2xl font-mono font-bold text-slate-900 tracking-wider">K</span>
</div>
<!-- Character Box 2: 7 -->
<div class="w-14 h-16 rounded-xl border-2 border-slate-800 flex items-center justify-center bg-white shadow-box">
<span class="text-2xl font-mono font-bold text-slate-900 tracking-wider">7</span>
</div>
<!-- Character Box 3: Q -->
<div class="w-14 h-16 rounded-xl border-2 border-slate-800 flex items-center justify-center bg-white shadow-box">
<span class="text-2xl font-mono font-bold text-slate-900 tracking-wider">Q</span>
</div>
<!-- Character Box 4: 4 -->
<div class="w-14 h-16 rounded-xl border-2 border-slate-800 flex items-center justify-center bg-white shadow-box">
<span class="text-2xl font-mono font-bold text-slate-900 tracking-wider">4</span>
</div>
<!-- Character Box 5: X -->
<div class="w-14 h-16 rounded-xl border-2 border-slate-800 flex items-center justify-center bg-white shadow-box">
<span class="text-2xl font-mono font-bold text-slate-900 tracking-wider">X</span>
</div>
</div>
<!-- Help Link Button -->
<button class="mt-5 text-sm font-semibold text-slate-800 hover:text-orange-600 transition-colors" type="button">
          ¿Qué es un código?
        </button>
<!-- Error / Validation Notice -->
<div class="mt-6 flex items-start text-left px-3 py-2 text-borrow-alertRed max-w-[320px]" data-purpose="validation-feedback">
<!-- Info/Alert Warning Icon -->
<div class="flex-shrink-0 mr-2 mt-0.5">
<svg class="w-4 h-4 fill-current" viewbox="0 0 20 20">
<path clip-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" fill-rule="evenodd"></path>
</svg>
</div>
<!-- Validation Text Message -->
<p class="text-xs font-semibold leading-snug">
            Este código no corresponde a ninguna organización <span class="font-medium text-[11px] block text-slate-500 mt-0.5">(si aplica, opcional)</span>
</p>
</div>
</section>
<!-- END: CodeInputSection -->
</div>
<!-- BEGIN: VirtualKeyboard -->
<footer class="w-full bg-[#D1D5DB] pt-2 pb-6 px-1.5 select-none" data-purpose="ios-alphanumeric-keyboard">
<!-- Keyboard Row 1: Q W E R T Y U I O P -->
<div class="flex justify-between gap-1 mb-2 px-0.5">
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">Q</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">W</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">E</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">R</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">T</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">Y</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">U</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">I</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">O</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">P</div>
</div>
<!-- Keyboard Row 2: A S D F G H J K L -->
<div class="flex justify-center gap-1 mb-2 px-3">
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">A</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">S</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">D</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">F</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">G</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">H</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">J</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">K</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">L</div>
</div>
<!-- Keyboard Row 3: Shift, Z X C V B N M, Backspace -->
<div class="flex justify-between gap-1 mb-2 px-0.5">
<!-- Shift Key -->
<div class="ios-key-special w-[42px] h-[42px] flex items-center justify-center text-slate-900">
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 4.5l-6.5 7h4v8h5v-8h4z"></path>
</svg>
</div>
<!-- Letters -->
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">Z</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">X</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">C</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">V</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">B</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">N</div>
<div class="ios-key flex-1 h-[42px] text-lg text-slate-900">M</div>
<!-- Backspace Key -->
<div class="ios-key-special w-[42px] h-[42px] flex items-center justify-center text-slate-900">
<svg class="w-5 h-5 stroke-[2] fill-none stroke-current" viewbox="0 0 24 24">
<path d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6-7h11a2 2 0 012 2v10a2 2 0 01-2 2H9l-6-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Keyboard Row 4: 123, Emoji, Spacebar, Return -->
<div class="flex justify-between gap-1.5 px-0.5">
<!-- 123 Number Mode Key -->
<div class="ios-key-special w-[42px] h-[42px] flex items-center justify-center font-medium text-xs text-slate-900">
          123
        </div>
<!-- Emoji Key -->
<div class="ios-key-special w-[38px] h-[42px] flex items-center justify-center text-slate-900">
<svg class="w-5 h-5 fill-none stroke-current stroke-2" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"></path>
</svg>
</div>
<!-- Spacebar -->
<div class="ios-key flex-[3] h-[42px] text-xs font-medium text-slate-700 tracking-wide">
          space
        </div>
<!-- Return / Action Key -->
<div class="ios-key-special flex-[1.4] h-[42px] flex items-center justify-center font-medium text-xs text-slate-900">
          return
        </div>
</div>
<!-- Keyboard Footer Bar: Globe & Dictation Icon + Home Indicator -->
<div class="flex justify-between items-center px-6 pt-2 text-slate-600">
<!-- Globe Icon -->
<svg class="w-5 h-5 stroke-current fill-none stroke-[1.75]" viewbox="0 0 24 24">
<circle cx="12" cy="12" r="9"></circle>
<path d="M3.6 9h16.8M3.6 15h16.8M12 3a14 14 0 010 18M12 3a14 14 0 000 18"></path>
</svg>
<!-- iOS Bottom Home Indicator Bar -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto self-end mb-1"></div>
<!-- Microphone Icon -->
<svg class="w-5 h-5 fill-current" viewbox="0 0 24 24">
<path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"></path>
<path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"></path>
</svg>
</div>
</footer>
<!-- END: VirtualKeyboard -->
</main>
<!-- END: MobileFrameContainer -->
</body></html>
