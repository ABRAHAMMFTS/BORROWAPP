<!DOCTYPE html>

<html lang="es"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Crear Organización - BorrowApp</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            borrowDark: '#132238',
            borrowDarkHover: '#0e1a2c',
            borrowOrange: '#FF6B2C',
            inputBorder: '#E2E8F0',
            inputBg: '#F8FAFC',
          }
        }
      }
    }
  </script>
<style data-purpose="custom-overrides">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    /* Estilización del select nativo para mantener diseño fluido */
    select {
      background-image: none !important;
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->
<!-- Contenedor adaptado a estándar iOS mobile (390px) -->
<div class="w-full max-w-[390px] min-h-[844px] bg-[#FFFFFF] flex flex-col justify-between shadow-2xl relative sm:rounded-[44px] overflow-hidden border border-slate-200">
<!-- BEGIN: TopBarAndHeader -->
<div>
<!-- Barra de estado simulada estilo iOS -->
<div class="w-full h-11 pt-3 px-7 flex justify-between items-center text-slate-800 text-xs font-semibold select-none">
<span>9:41</span>
<div class="flex items-center space-x-1.5">
<!-- Icono Señal Móvil -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.23C2.88 16.48 2 14.34 2 12 2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.34-.88 4.48-2.35 6.23l-.62-.62C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 4c-2.76 0-5 2.24-5 5 0 1.15.39 2.21 1.05 3.06l.71-.71C8.28 13.73 8 12.9 8 12c0-2.21 1.79-4 4-4s4 1.79 4 4c0 .9-.28 1.73-.76 2.35l.71.71C16.61 14.21 17 13.15 17 12c0-2.76-2.24-5-5-5zm0 4c-.55 0-1 .45-1 1 0 .28.11.53.29.71l.71.71.71-.71c.18-.18.29-.43.29-.71 0-.55-.45-1-1-1z"></path>
</svg>
<!-- Icono Wifi -->
<svg class="w-3.5 h-3.5 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.5 0 6.7 1.34 9.14 3.55L12 19.3 2.86 11.05C5.3 8.84 8.5 7.5 12 7.5z"></path>
</svg>
<!-- Icono Batería -->
<div class="w-5 h-2.5 border border-slate-700 rounded-sm p-0.5 flex items-center">
<div class="h-full w-full bg-slate-800 rounded-2xs"></div>
</div>
</div>
</div>
<!-- Header principal de navegación -->
<header class="px-5 pt-2 pb-4 flex items-center relative">
<button aria-label="Volver" class="w-10 h-10 -ml-2 rounded-full flex items-center justify-center text-slate-800 hover:bg-slate-100 transition-colors" type="button">
<svg class="w-6 h-6 stroke-[2.2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<h1 class="text-xl font-bold text-slate-900 tracking-tight ml-1">Crear Organización</h1>
</header>
<!-- END: TopBarAndHeader -->
<!-- BEGIN: OrganizationForm -->
<main class="px-6 pt-2">
<form class="space-y-5" id="create-org-form">
<!-- Campo 1: Nombre de la organización -->
<div class="space-y-1.5" data-purpose="form-group-name">
<label class="block text-sm font-semibold text-slate-800" for="org-name">
              Nombre
            </label>
<input class="w-full px-4 py-3.5 bg-white border border-inputBorder rounded-xl text-slate-900 text-[15px] font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all shadow-xs" id="org-name" name="org-name" placeholder="Ej: Nombre de la institución" type="text" value="Universidad Tecnológica de Bolívar"/>
</div>
<!-- Campo 2: Tipo de organización -->
<div class="space-y-1.5" data-purpose="form-group-type">
<label class="block text-sm font-semibold text-slate-800" for="org-type">
              Tipo
            </label>
<div class="relative">
<select class="w-full px-4 py-3.5 bg-white border border-inputBorder rounded-xl text-slate-900 text-[15px] font-medium appearance-none focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all shadow-xs pr-10 cursor-pointer" id="org-type" name="org-type">
<option selected="" value="universidad">Universidad</option>
<option value="empresa">Empresa</option>
<option value="conjunto">Conjunto Residencial</option>
<option value="comunidad">Comunidad</option>
</select>
<!-- Flecha desplegable (⌄) -->
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-500">
<svg class="w-5 h-5 stroke-[2]" fill="none" stroke="currentColor" viewbox="0 0 24 24">
<path d="M19.5 8.25l-7.5 7.5-7.5-7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
</div>
<!-- Campo 3: Código de membresía -->
<div class="space-y-1.5" data-purpose="form-group-code">
<label class="block text-sm font-semibold text-slate-800" for="member-code">
              Tu código estudiantil/empleado/apto
            </label>
<input class="w-full px-4 py-3.5 bg-white border border-inputBorder rounded-xl text-slate-900 text-[15px] font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all shadow-xs" id="member-code" name="member-code" placeholder="Ingresa tu identificación" type="text" value="Tu código estudiantil/empleado/apto"/>
</div>
<!-- Campo 4: Punto de entrega y devolución -->
<div class="space-y-1.5" data-purpose="form-group-delivery-point">
<label class="block text-sm font-semibold text-slate-800" for="pickup-point">
              Punto común de entrega y devolución de préstamos
            </label>
<input class="w-full px-4 py-3.5 bg-white border border-inputBorder rounded-xl text-slate-900 text-[15px] font-medium placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent transition-all shadow-xs" id="pickup-point" name="pickup-point" placeholder="Ej: Recepción principal" type="text" value="Biblioteca Central, mostrador de at"/>
</div>
</form>
</main>
<!-- END: OrganizationForm -->
</div>
<!-- BEGIN: BottomActionArea -->
<!-- Contenedor del botón principal con barra de inicio de iOS -->
<div class="px-6 pt-4 pb-8 space-y-4">
<button class="w-full py-4 px-6 bg-borrowDark hover:bg-borrowDarkHover text-white font-semibold text-[15px] rounded-xl shadow-md active:scale-[0.99] transition-all flex items-center justify-center cursor-pointer" form="create-org-form" type="submit">
        Crear organización
      </button>
<!-- Indicador Home bar estilo iOS -->
<div class="w-32 h-1 bg-slate-900 rounded-full mx-auto opacity-30 mt-2"></div>
</div>
<!-- END: BottomActionArea -->
</div>
<!-- END: MobileContainer -->
</body></html>
